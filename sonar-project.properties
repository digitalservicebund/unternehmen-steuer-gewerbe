sonar.projectKey=digitalservicebund_unternehmen-steuer-gewerbe
sonar.organization=digitalservicebund

# exclude reference files and pnpm-lock.yml
sonar.exclusions=**/schemaXsd/**/*.xsd, **/xml-samples/**/*.xml, **/schematron/**/*.xsl, **/schematron/**/*.sef.jsonq, pnpm-lock.yaml

sonar.featureflag.cloud-security-enable-generic-yaml-and-json-analyzer=true

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/index.ts,**/requestLogging.ts,**/testHelpers/**

# The test file intentionally repeats assertions and setup for readability — duplication is acceptable here.
# xGewerbeordnungCodes.ts contains reference code lists (e.g. Hamburg PLZ tables) - the repeated structure is data, not logic.
sonar.cpd.exclusions=src/routes/registerGewerbe/registerGewerbe.integration.test.ts, src/routes/registerGewerbe/requestDataTransformer/xGewerbeordnungCodes.ts

sonar.pullrequest.github.summary_comment=false

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=unternehmen-steuer-gewerbe
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
