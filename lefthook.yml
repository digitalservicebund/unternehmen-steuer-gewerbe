pre-commit:
  parallel: true
  jobs:
    - name: Lint
      run: pnpm run lint:fix
      stage_fixed: true
    - name: Format
      run: pnpm run format:fix
      stage_fixed: true
    - name: Secret scanning
      run: trivy fs --scanners secret --exit-code 1 --skip-files "**/generated.spezifikation.sef.json" --skip-files "**/.env" --skip-dirs ".claude" .
