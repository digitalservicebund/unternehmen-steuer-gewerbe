name: Contract Tests

on:
  schedule:
    # Every 30 min, 06:00-18:00 Europe/Berlin (approximated as UTC+2/CEST;
    # cron is fixed UTC so this drifts 1h during CET/winter)
    - cron: "*/30 4-16 * * *"
    # Hourly outside that window (18:00-06:00 Berlin)
    - cron: "0 17-23,0-3 * * *"
  workflow_dispatch:

jobs:
  contract-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        name: Install pnpm
        with:
          cache: true

      - name: Configure git to use HTTPS for GitHub
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPOSITORY_ACCESS_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"
          pnpm install --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_REPOSITORY_ACCESS_TOKEN }}

      - name: Run contract tests
        run: pnpm run test:contract:ci
        env:
          FIT_CONNECT_OAUTH_TOKEN_URL: ${{ vars.FIT_CONNECT_OAUTH_TOKEN_URL }}
          FIT_CONNECT_SUBMISSION_API_URL: ${{ vars.FIT_CONNECT_SUBMISSION_API_URL }}
          FIT_CONNECT_DESTINATION_API_URL: ${{ vars.FIT_CONNECT_DESTINATION_API_URL }}
          FIT_CONNECT_ROUTING_API_URL: ${{ vars.FIT_CONNECT_ROUTING_API_URL }}
          FIT_CONNECT_PUBLIC_KEY_ENCRYPTION_JWK: ${{ vars.FIT_CONNECT_PUBLIC_KEY_ENCRYPTION_JWK }}
          FIT_CONNECT_PRIVATE_KEY_DECRYPTION_JWK: ${{ secrets.FIT_CONNECT_PRIVATE_KEY_DECRYPTION_JWK }}
          FIT_CONNECT_CLIENT_ID: ${{ vars.FIT_CONNECT_CLIENT_ID }}
          FIT_CONNECT_CLIENT_SECRET: ${{ secrets.FIT_CONNECT_CLIENT_SECRET }}
          FIT_CONNECT_DESTINATION_ID: ${{ vars.FIT_CONNECT_DESTINATION_ID }}
          AKDB_BASE_URL: ${{ vars.AKDB_BASE_URL }}
          AKDB_USERNAME: ${{ vars.AKDB_USERNAME }}
          AKDB_PASSWORD: ${{ secrets.AKDB_PASSWORD }}

      - name: Send failure to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 #v1.6.1
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.ALERTS_CHANNEL_ID }}
