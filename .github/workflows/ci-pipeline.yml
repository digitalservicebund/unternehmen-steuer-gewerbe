name: CI Pipeline

on:
  # run when pushing to main
  push:
    branches:
      - main
  # run on PRs based on main
  pull_request:
    branches:
      - main
  # allow for running this workflow manually (button in GitHub Actions UI)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        name: Install pnpm
        with:
          version: 10.33.0
          cache: true

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build
        run: pnpm build

  # Note: Formatting and linting do break the pipeline
  # There's a Git hooks setup to fix both before pushing. Cf. the repository README
  check-format-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        name: Install pnpm
        with:
          version: 10.33.0
          cache: true

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Check format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

  test-and-scan-with-sonarcloud-if-not-dependabot-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        name: Install pnpm
        with:
          version: 10.33.0
          cache: true

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      ##################################
      # Tests run here
      ##################################

      - name: Run tests with coverage report
        run: pnpm run test:coverage

      ################################
      # SonarCloud for static code and test coverage analyses
      # requires the SonarQubeCloud GitHub app in the repository
      ################################

      - name: Cache SonarQube packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Break pipeline on Sonar quality gate
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build docker image
        run: docker build . --tag "unternehmen-steuer-gewerbe"

  #######################################
  # Automerge if it's a dependabot PR and all tests are passing and it's a non-major version update
  # cf. ../dependabot.yml for details on Dependabot like e.g. the cooldown period we're using
  # Follows this recipe of the GitHub docs: https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automating-dependabot-with-github-actions#enabling-automerge-on-a-pull-request
  #######################################

  dependabot-auto-merge:
    runs-on: ubuntu-latest
    # the ${{ success() }} is required for the "if" not to override the "needs" below
    # (we did run into this problem and saw auto-merges even as "frontend-checks" failed)
    if: ${{ github.event_name != 'schedule' && success() && github.actor == 'dependabot[bot]' && !cancelled() && github.ref != 'refs/heads/main' && github.repository == 'digitalservicebund/unternehmen-steuer-gewerbe'}}
    needs:
      - check-format-and-lint
      - test-and-scan-with-sonarcloud-if-not-dependabot-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        continue-on-error: true
        id: metadata
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Auto-merge Dependabot PRs except major version updates
        continue-on-error: true
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
