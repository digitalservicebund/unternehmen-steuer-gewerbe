name: Bump node image

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-chainguard-images:
    runs-on: ubuntu-latest
    steps:
      - name: bump node image
        uses: digitalservicebund/bump-chainguard-digest@5cef1778a56ae77fec46e2975f767a6a91049edf
        with:
          image_name: node
          file_path: Dockerfile
          github_token: ${{ github.token }}
          branch: bump-node-image-branch-do-not-delete
